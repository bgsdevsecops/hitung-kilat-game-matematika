replicaCount: 1

nameOverride: "hitung-kilat-api"
fullnameOverride: "hitung-kilat-api"

image:
  repository: docker-hub.solusi-k8s.com/myindo/hitung-kilat-api
  pullPolicy: Always
  tag: "latest"

kind: Deployment

env:
  - name: NODE_ENV
    value: "development"
  - name: PORT
    value: "3000"
  - name: GOOGLE_APPLICATION_CREDENTIALS
    value: "/var/run/secrets/firebase/serviceAccount.json"

envFrom: []

imagePullSecrets:
  - name: myindo-read

service:
  type: ClusterIP
  port: 80
  protocol: TCP
  containerPort: 3000

livenessProbe:
  httpGet:
    path: /api/health
    port: 3000
  initialDelaySeconds: 15
  timeoutSeconds: 3
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/health
    port: 3000
  initialDelaySeconds: 15
  timeoutSeconds: 3
  periodSeconds: 10
  failureThreshold: 3

httpRoute:
  enabled: true
  routes:
    - name: api
      parentRefs:
        - kind: Gateway
          name: apisix
          namespace: ingress-apisix
          sectionName: https
          port: 443
      hostnames:
        - hitung-kilat.k8s.web.id
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /api
          timeouts:
            request: 30s
            backendRequest: 30s
          backendRefs:
            - name: hitung-kilat-api
              port: 80

extraVolumes:
  - name: firebase-admin
    secret:
      secretName: hitung-kilat-firebase-admin
      optional: false

volumeMounts:
  - name: firebase-admin
    mountPath: /var/run/secrets/firebase
    readOnly: true
